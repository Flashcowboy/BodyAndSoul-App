<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="pageTitleCategories">Kategorien</title>
    <link rel="stylesheet" href="../styles.css">

    <style>
        

        body {
            background-color: #f2f4f7;
            /* Hintergrundbild direkt auf den Body anwenden */
            background-image: url('../assets/images/splash_screen_bg.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        header {
            text-align: center;
            padding: 20px 0;
            background-color: rgba(81, 77, 52, 0.0);
        }


        main {
            /* The global rule already has overflow-y, but this page has specific padding */
            padding: 25px 10px;
        }

        .category-card {
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
            overflow: hidden;
            position: relative;
            width: 100%;
            height: 150px;
        }

    /* Only target the background image inside the card, not nested icons */
    .category-card > img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        .card-text {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 15px;
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.4);
            color: rgb(242, 237, 237);
            font-size: 12px;
            font-weight: regular;
        }

        .for-you-section {
            background-color: #fff;
            border-radius: 12px;
            background-image: url('../assets/images/backgrounds/bg_grassleaves_blue.png');
            background-size: cover;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
            padding: 15px;
        }

        .challenge-button {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            z-index: 2;
        }

        .challenge-button .challenge-icon {
            height: 18px;
            width: 18px;
            object-fit: contain;
            /* Ensure the icon participates in the flex layout and doesn't overlap the label */
            position: static;
        }
    </style>
</head>
<body>


    <header>
        <h3 data-i18n="Cat_Header">Herzlich Willkommen<br>Dein Autogenes Training</h3>
    </header>

    <main>
        <div><a href="store/abo-buy-2025-uiiuZZTtg8io.html">Abo kaufen</a></div>
        <div class="for-you-section">
            <p data-i18n="forYouTitle">...</p> <!-- Willkommenstext -->
            <div class="mood-buttons">
                <button class="mood-button" data-tag="gestresst" data-i18n="moodStress">Gestresst</button>
                <button class="mood-button" data-tag="fokussiert" data-i18n="moodFocus">Fokussiert</button>
                <button class="mood-button" data-tag="müde" data-i18n="moodTired">Müde</button>
                <button class="mood-button" data-tag="unruhig" data-i18n="moodRestless">Unruhig</button>
                <button class="mood-button" data-tag="überfordert" data-i18n="moodOverstrained">Überfordert</button>
                <button class="mood-button" data-tag="traurig" data-i18n="moodSad">Traurig</button>
                <button class="mood-button" data-tag="aggressiv" data-i18n="moodAggressiv">Agressiv</button>
                <button class="mood-button" data-tag="schmerz" data-i18n="moodPain">Schmerz</button>
                <button class="mood-button" data-tag="ängstlich" data-i18n="moodScared">Ängstlich</button>
            </div>
        </div>

        <!-- Container for the results, which will be dynamically populated -->
        <div id="for-you-results"></div>

         <div class="category-card" id="Cat_card1Title" data-href="subcategories/subcat01_whatisat.html">
            <img src="../assets/images/categories/cat_01.png" alt="Allgemeine Entspannung">
            <div class="card-text">
                <h2 data-i18n="card1Title">Allgemeine Entspannung</h2>
            </div>
        </div>

        <div class="category-card" id="Cat_card2Title" data-href="subcategories/subcat02_basics.html">
            <img src="../assets/images/categories/cat_02.png" alt="Grundübungen">
            <div class="challenge-button" data-challenge-href="subcategories/subcat03_anxiety.html?challenge=true">
                <img class="challenge-icon" src="../assets/images/icons/calendar.png" alt="Challenge">
                <span data-i18n="challengeButtonLabel_21">21-Tage Challenge</span>
            </div>
            <div class="card-text">
                <h2 data-i18n="card2Title">Grundübungen</h2>
            </div>
        </div>

        <div class="category-card" id="Cat_card3Title" onclick="window.location.href = 'subcategories/subcat03_anxiety.html';">
            <img src="../assets/images/categories/cat_11.png" alt="Ängste besiegen">
            <div class="card-text">
                <h2 data-i18n="card3Title">Angstbewältigung</h2>
            </div>
            <!-- <div class="challenge-button" data-challenge-href="subcategories/subcat03_anxiety.html?challenge=true">

                <span data-i18n="challengeButtonLabel">14-Tage Challenge</span>
            </div> -->

        <div class="category-card" id="Cat_card4Title" onclick="window.location.href = 'subcategories/subcat04_depression.html';">

            <div class="card-text">
                <h2 data-i18n="card4Title">Depressionen bekämpfen</h2>
            </div>
            <!-- <div class="challenge-button" data-challenge-href="../subcategories/subcat04_goals.html?challenge=true">
                <img class="challenge-icon" src="../assets/images/icons/calendar.png" alt="Challenge">
                <span data-i18n="challengeButtonLabel">14-Tage Challenge</span>
            </div> -->
        </div>

        <div class="category-card" id="Cat_card5Title" onclick="window.location.href = 'subcategories/subcat05_bonus.html';">
            <img src="../assets/images/categories/bonus.png" alt="Bonus-Inhalte">
            <div class="card-text">
                <h2 data-i18n="card5Title">Bonus-Inhalte</h2>
            </div>
            <!-- <div class="challenge-button" data-challenge-href="../subcategories/subcat04_goals.html?challenge=true">
                <img class="challenge-icon" src="../assets/images/icons/calendar.png" alt="Challenge">
                <span data-i18n="challengeButtonLabel">14-Tage Challenge</span>
            </div> -->
        </div>

   
    </main>

        fetch('/structure/footer.html')
