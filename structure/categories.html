<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="pageTitleCategories">Kategorien</title>
    <link rel="stylesheet" href="../styles.css">

    <style>
         body {
            display: flex;
            flex-direction: column;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            background-color: #f8f9fb;
            /* Hintergrundbild direkt auf den Body anwenden */
            background-image: url('../assets/images/backgrounds/bg_mountains_blue.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

                header {
            text-align: center;
            padding: 5px 0;
        }

        main {
            flex-grow: 1;
            overflow-y: auto;
            padding: 25px 10px;
        }

        .category-card {
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
            overflow: hidden;
            position: relative;
            width: 100%;
            height: 150px;
        }

        .category-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        .card-text {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 15px;
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.2);
            color: rgb(242, 237, 237);
            font-size: 12px;
            font-weight: regular;
        }

    </style>
</head>
<body>


    <header>
        <h3 data-i18n="Cat_Header">Herzlich Willkommen<br>Dein Autogenes Training</h3>
    </header>

    <main>
         <div class="category-card" id="Cat_card1Title" onclick="window.location.href = 'subcategories/subcat01_whatisat.html';">

            <div class="card-text">
                <h2 data-i18n="card1Title">Allgemeine Entspannung</h2>
            </div>
        </div>

        <div class="category-card" id="Cat_card2Title" onclick="window.location.href = 'subcategories/subcat02_basics.html';">

        </div>

            </div>

        </div>

        <div class="category-card" id="Cat_card11Title" onclick="window.location.href = 'subcategories/subcat10_smokeless.html';">

        </div>
    </main>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="../main.js"></script>
