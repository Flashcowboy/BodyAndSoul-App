<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="pageTitleCategories">Kategorien</title>
    <link rel="stylesheet" href="../styles.css">

    <style>
        

        body {
            background-color: #f2f4f7;
            /* Hintergrundbild direkt auf den Body anwenden */
            background-image: url('../assets/images/splash_screen_bg.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        header {
            text-align: center;
            padding: 20px 0;
            background-color: rgba(81, 77, 52, 0.0);
        }


        main {
            /* The global rule already has overflow-y, but this page has specific padding */
            padding: 25px 10px;
        }

        .category-card {
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
            overflow: hidden;
            position: relative;
            width: 100%;
            height: 150px;
        }

        .category-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        .card-text {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 15px;
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.2);
            color: rgb(242, 237, 237);
            font-size: 12px;
            font-weight: regular;
        }

        .for-you-section {
            background-color: #fff;
            border-radius: 12px;
            background-image: url('../assets/images/backgrounds/bg_grassleaves_blue.png');
            background-size: cover;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
            padding: 15px;
        }
    </style>
</head>
<body>


    <header>
        <h3 data-i18n="Cat_Header">Herzlich Willkommen<br>Dein Autogenes Training</h3>
    </header>

    <main>
        <div class="for-you-section">
            <p data-i18n="forYouTitle">...</p> <!-- Willkommenstext -->
            <div class="mood-buttons">
                <button class="mood-button" data-tag="stress" data-i18n="moodStress">Gestresst</button>
                <button class="mood-button" data-tag="fokussiert" data-i18n="moodFocus">Fokussiert</button>
                <button class="mood-button" data-tag="müde" data-i18n="moodTired">Müde</button>
                <button class="mood-button" data-tag="unruhe" data-i18n="moodStress">Unruhig</button>
                <button class="mood-button" data-tag="überfordert" data-i18n="moodOverstrained">Überfordert</button>
                <button class="mood-button" data-tag="traurigkeit" data-i18n="moodSad">Traurig</button>
                <button class="mood-button" data-tag="aggressiv" data-i18n="moodAggressiv">Agressiv</button>
                <button class="mood-button" data-tag="schmerzen" data-i18n="moodPain">Schmerz</button>
                <button class="mood-button" data-tag="ängstlich" data-i18n="moodScared">Ängstlich</button>
            </div>
        </div>

        <!-- Container for the results, which will be dynamically populated -->
        <div id="for-you-results"></div>

         <div class="category-card" id="Cat_card1Title" onclick="window.location.href = 'subcategories/subcat01_whatisat.html';">
            <img src="../assets/images/categories/cat_01.png" alt="Allgemeine Entspannung">
            <div class="card-text">
                <h2 data-i18n="card1Title">Allgemeine Entspannung</h2>
            </div>
        </div>

        <div class="category-card" id="Cat_card2Title" onclick="window.location.href = 'subcategories/subcat02_basics.html';">
            <img src="../assets/images/categories/cat_02.png" alt="Grundübungen">
            <div class="card-text">
                <h2 data-i18n="card2Title">Grundübungen</h2>
            </div>
        </div>

        <div class="category-card" id="Cat_card3Title" onclick="window.location.href = 'subcategories/subcat03_sleep.html';">
            <img src="../assets/images/categories/cat_03.png" alt="Erholsamer Schlaf">
            <div class="card-text">
                <h2 data-i18n="card3Title">Für einen erholsamen Schlaf</h2>
            </div>
        </div>

        <div class="category-card" id="Cat_card4Title" onclick="window.location.href = 'subcategories/subcat04_goals.html';">
            <img src="../assets/images/categories/cat_04.png" alt="Ziele erreichen">
            <div class="card-text">
                <h2 data-i18n="card4Title">Ziele erreichen</h2>
            </div>
        </div>

        <div class="category-card" id="Cat_card5Title" onclick="window.location.href = 'subcategories/subcat05_weightloss.html';">
            <img src="../assets/images/categories/cat_05.png" alt="Abnehmen">
            <div class="card-text">
                <h2 data-i18n="card5Title">Abnehmen</h2>
            </div>
        </div>

        <div class="category-card" id="Cat_card6Title" onclick="window.location.href = 'subcategories/subcat06_emotions.html';">
            <img src="../assets/images/categories/cat_06.png" alt="Emotionale Stabilität">
            <div class="card-text">
                <h2 data-i18n="card6Title">Emotionale Stabilität</h2>
            </div>
        </div>
        <div class="category-card" id="Cat_card7Title" onclick="window.location.href = 'subcategories/subcat07_health.html';">
            <img src="../assets/images/categories/cat_07.png" alt="Für ein gesundes Leben">
            <div class="card-text">
                <h2 data-i18n="card7Title">Für ein gesundes Leben</h2>
            </div>
        </div>

        <div class="category-card" id="Cat_card8Title" onclick="window.location.href = 'subcategories/subcat08_relaxed.html';">
            <img src="../assets/images/categories/cat_08.png" alt="Grundübungen">
            <div class="card-text">
                <h2 data-i18n="card8Title">Entspannt und ausgeglichen</h2>
            </div>
        </div>

        <div class="category-card" id="Cat_card9Title" onclick="window.location.href = 'subcategories/subcat09_habits.html';">
            <img src="../assets/images/categories/cat_09.png" alt="Gewohnheiten ändern">
            <div class="card-text">
                <h2 data-i18n="card9Title">Gewohnheiten ändern</h2>
            </div>
        </div>

        <div class="category-card" id="Cat_card10Title" onclick="window.location.href = 'subcategories/subcat10_smokeless.html';">
            <img src="../assets/images/categories/cat_10.png" alt="Nichtraucher werden">
            <div class="card-text">
                <h2 data-i18n="card10Title">Nichtraucher werden</h2>
            </div>
        </div>

        <div class="category-card" id="Cat_card11Title" onclick="window.location.href = 'subcategories/subcat11_selfconfidence.html';">
            <img src="../assets/images/categories/cat_11.png" alt="Mehr Selbstvertrauen">
            <div class="card-text">
                <h2 data-i18n="card11Title">Selbstvertrauen</h2>
            </div>
        </div>
    </main>

     <script>
        fetch('/structure/footer.html')
            .then(response => response.text())
            .then(data => {
                document.body.insertAdjacentHTML('beforeend', data);
            });
    </script>

    <!-- Hier wird die Logik der App eingefügt -->
<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
<script src="../firebase-config.js"></script>
    <script src="../main.js"></script>

    


</body>
</html>
