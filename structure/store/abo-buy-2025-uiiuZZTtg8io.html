    /* ---------- Design 1: Ruhe & Natur ---------- */

    .cta{

        text-decoration:none;
        text-shadow: 0 1px 1px rgba(0,0,0,0.7);

    /* ---------- Design 2: Modern & Klar ---------- */
    .split{
        display:flex;
        gap:20px;
        align-items:center;
        margin-top:30px;
        justify-content:center; /* Panels mittig ausrichten */
        flex-wrap:wrap; /* sinnvolles Umbruchverhalten auf großen Viewports */
    }
    .panel{
        flex:0 1 320px; /* als Block mit definierter max-Breite */
        width: 100%;
        max-width: 720px;
        margin: 0 auto; /* Panel-Box selbst zentriert */
        background:#fff;
        border-radius:12px;
        padding:18px;
        box-shadow: var(--shadow);
        display:flex;
        flex-direction:column;
        align-items:center;
        text-align:center;
    }
    .panel.left{
        background: linear-gradient(180deg,#ffffff,#f7fbfb);
    }
    .price-list{
        display:flex;
        flex-direction:column;
        gap:12px;
        margin-top:12px;
        align-items:center;
    }
    .price-row{
        display:flex;
        align-items:center;
        justify-content:flex-start; /* rechts kein Kaufen-Button mehr */
        padding:12px;
        border-radius:10px;
        border:1px solid #eef4f2;
        width:100%;
        max-width:520px;
    }

    .price-row .label{

        font-weight:600;

    }
    .price-row .meta{font-size:13px;color:var(--muted)}
    .cta-alt{

        font-weight:700;

  .buy-submit .cta{

    width:100%;
    max-width:720px; /* mehr Breite (Seitenbreite) */
    margin:0 auto;
    padding:16px 22px; /* höhere Präsenz */
    font-size:18px;    /* größere Typo */

  /* Glass-Look für Kaufbutton */
  .cta.btn-glass{
    position: relative;
    background: linear-gradient(135deg, rgba(255,255,255,0.20), rgba(255,255,255,0.08));
    backdrop-filter: blur(12px) saturate(120%);
    -webkit-backdrop-filter: blur(12px) saturate(120%);
    border: 1px solid rgba(255,255,255,0.45);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.40) inset,
      0 -1px 0 rgba(255,255,255,0.20) inset,
      0 8px 24px rgba(0,0,0,0.25);
    color:#fff;
    text-shadow: 0 1px 1px rgba(0,0,0,0.5);
    border-radius: 12px;
  }
  .cta.btn-glass::before{
    content: "";
    position: absolute;
    left: 6px; right: 6px; top: 6px;
    height: 48%;
    border-radius: inherit;
    background: linear-gradient(to bottom, rgba(255,255,255,0.55), rgba(255,255,255,0.14) 60%, rgba(255,255,255,0));
    pointer-events: none;
  }
  .cta.btn-glass:hover{
    border-color: rgba(255,255,255,0.55);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.45) inset,
      0 -1px 0 rgba(255,255,255,0.24) inset,
      0 10px 28px rgba(0,0,0,0.3);
  }
  .cta.btn-glass:active{
    transform: translateY(1px);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.35) inset,
      0 -1px 0 rgba(255,255,255,0.18) inset,
      0 6px 18px rgba(0,0,0,0.25);
  }

    /* ---------- Glassmorphism Cards ---------- */
    .glass-card-gold {
      /* Grund-Layer mit Glassmorphismus */
      position: relative;
      background: linear-gradient(135deg, rgba(255,255,255,0.20) 0%, rgba(255,255,255,0.10) 60%, rgba(255,255,255,0.05) 100%),
                  linear-gradient(135deg, rgba(245, 208, 115, 0.40) 0%, rgba(230, 184, 63, 0.32) 50%, rgba(184, 134, 11, 0.28) 100%);

        0 -1px 0 rgba(255,255,255,0.7) inset, /* inner highlight bottom */

      margin: 0 auto;
      text-align: left; /* Inhalt bleibt links für Listenlesbarkeit */
      /* text-shadow: 0 1px 1px rgba(0,0,0,0.7); */

    }

    .glass-card {
      /* Grund-Layer mit Glassmorphismus */
      position: relative;
      background: linear-gradient(135deg, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.10) 60%, rgba(255,255,255,0.06) 100%),

      backdrop-filter: blur(16px) saturate(120%);
      -webkit-backdrop-filter: blur(16px) saturate(120%);
      border-radius: 20px;
      padding: 15px;
      /* width: 100%; */
      max-width: 720px;
      /* Randbetonung: feine helle Kante + weicher Schimmer außen */
      border: 1px solid rgba(255, 255, 255, 0.35);
      box-shadow:
        0 1px 0 rgba(255,255,255,0.7) inset, /* inner highlight top */
        0 -1px 0 rgba(255,255,255,0.7) inset, /* inner highlight bottom */
        0 8px 26px rgba(5, 15, 25, 0.7);     /* outer soft shadow */
      margin: 0 auto;
      text-align: left; /* Inhalt bleibt links für Listenlesbarkeit */
    }

    /* Pseudo-Elemente für goldene Glanzkanten */
    .glass-card-gold::before,
    .glass-card-gold::after {
      content: "";
      position: absolute;
      pointer-events: none;
      border-radius: inherit;
      transition: opacity 160ms ease;
    }
    .glass-card-gold::before {
      top: 0;
      left: 0;
      right: 0;
      height: 46px;
      background: linear-gradient(to bottom, rgba(255,245,200,0.70), rgba(255,235,160,0.22) 60%, rgba(255,255,255,0));
      opacity: 0.95;
    }
    .glass-card-gold::after {
      top: 10px;
      left: 10px;
      width: 40%;
      height: 40%;
      background: radial-gradient( circle at top left,
            rgba(255,245,200,0.60), rgba(253, 216, 120, 0.35) 45%, rgba(255,255,255,0) 70% );
      filter: blur(1px);
      opacity: 0.65;
    }
    .glass-card-gold:hover::before { opacity: 1; }
    .glass-card-gold:hover::after  { opacity: 0.78; }

    /* Glare/Highlight-Kanten als Pseudo-Elemente */
    .glass-card::before,
    .glass-card::after {
      content: "";
      position: absolute;
      pointer-events: none;
      border-radius: inherit;
      transition: opacity 160ms ease;
    }
    /* Oberer Kanten-Glanz */
    .glass-card::before {
      top: 0;
      left: 0;
      right: 0;
      height: 46px;
      background: linear-gradient(to bottom, rgba(255,255,255,0.65), rgba(255,255,255,0.15) 60%, rgba(255,255,255,0));
      opacity: 0.9;
    }
    /* Diagonaler Glare-Fleck */
    .glass-card::after {
      top: 10px;
      left: 10px;
      width: 40%;
      height: 40%;
      background: radial-gradient( circle at top left,
            rgba(255,255,255,0.55), rgba(255,255,255,0.25) 45%, rgba(255,255,255,0) 70% );
      filter: blur(1px);
      opacity: 0.6;
    }

    /* Hover: leicht mehr Glanz, ohne zu stark zu werden */
    .glass-card:hover::before { opacity: 1; }
    .glass-card:hover::after  { opacity: 0.75; }
    .features-list {

    }

</style>

<script>
    // Extra guard: prevent unintended horizontal page shift while interacting with player
    (function(){
        const root = document.scrollingElement || document.documentElement;
        let lastX = 0, active = false;
        window.addEventListener('touchstart', (e)=>{
            if(!e.touches || !e.touches.length) return;
            lastX = e.touches[0].clientX; active = true;
        }, {passive:true});
        window.addEventListener('touchmove', (e)=>{
            if(!active || !e.touches || !e.touches.length) return;
            const dx = Math.abs(e.touches[0].clientX - lastX);
            if (dx > 4) {
                // lock horizontal by resetting scrollLeft
                if (root.scrollLeft !== 0) root.scrollLeft = 0;
                // prevent browser from attempting horizontal pan
                if (e.cancelable) e.preventDefault();
            }
        }, {passive:false});
        window.addEventListener('touchend', ()=>{ active = false; }, {passive:true});
    })();
    </script>


<script>
  // Öffnet den Modal
  function openModal(){ document.getElementById('modal').style.display='flex'; }
  function closeModal(){ document.getElementById('modal').style.display='none'; }

  // Beispiel-Funktion: leitet zum Digistore24-Link weiter.
  // Ersetze die data-link Werte durch deine echten Digistore24-URLs.
  function openPurchase(url, plan){
    if(!url || url.includes('REPLACE_WITH_DIGISTORE24_LINK')){
      // Deutlich sichtbarer Hinweis, damit du die Links im Template nicht vergisst
      alert('Bitte ersetze die Platzhalter-Links durch deine Digistore24-Produktlinks.\n\nGeplanter Kauf: ' + plan);
      return;
    }
    // Optional: hier Tracking / Analytics vor dem Weiterleiten
    window.location.href = url;
  }

  // Schließe Modal bei Escape
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape') closeModal();
  });

  // Klick außerhalb schließt Modal
  document.getElementById('modal').addEventListener('click', function(e){
    if(e.target === this) closeModal();
  });

  // Zentraler Kauf-Button: nutzt die Radio-Auswahl
  (function(){
    const buttons = document.querySelectorAll('.purchaseBtn, #purchaseBtn');
    if(!buttons.length) return;
    buttons.forEach(btn => {
      btn.addEventListener('click', function(){
        const checked = document.querySelector('input[name="plan"]:checked');
        if(!checked){
          alert('Bitte wähle ein Abo aus.');
          return;
        }
        const plan = checked.value;
        const link = checked.dataset.link;
        openPurchase(link, plan);
      });
    });
  })();
</script>
