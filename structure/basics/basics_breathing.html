<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="pageTitleSubCategories">Grundübungen</title>
    <link rel="stylesheet" href="../../styles.css">
    <style>
        body {
            background-color: #f4f4f9;
            background-image: url('../../assets/images/splash_screen_bg.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        header {
            text-align: center;
            padding: 5px 0;
        }

        main {
            padding: 25px 10px;
        }

        .subcategory-card {
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.8);
            margin-bottom: 20px;
            overflow: hidden;
            position: relative;
            width: 100%;
            height: 150px;
        }

        .subcategory-card img:not(.favorite-icon) {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }
        
        .card-text {
            position: absolute;
            bottom: 0;
            left: 0;
            top: 60px; 
            width: 100%;
            padding: 15px;
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.3);
            color: rgb(242, 237, 237);
            font-size: 16px;
        }

        .favorite-icon {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 30px;
            height: 30px;
            cursor: pointer;
            z-index: 1;
        }

        /* --- Timeline Styles --- */
        #course-timeline-container {
            margin-top: -20px; /* Overlap with the card */
            padding: 20px;
            position: relative;
            z-index: -1; /* Position behind the card */
        }

        .timeline-node {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            position: relative;
            padding-left: 60px; /* Space for the circle */
        }

        .timeline-node::before {
            content: '';
            position: absolute;
            left: 29px; /* Center of the circle */
            top: 0;
            height: 100%;
            width: 4px;
            background-color: #ccc;
        }

        .timeline-node:last-child::before {
            height: 30px; /* End line at center of last circle */
        }

        .node-circle {
            position: absolute;
            left: 10px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #ccc;
            color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            border: 2px solid #888;
        }

        .timeline-node.completed .node-circle {
            background-color: #a28b49;
            color: white;
            border-color: #a28b49;
        }

        .node-label {
            font-size: 16px;
            background: white;
            padding: 10px;
            border-radius: 8px;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <h3 data-i18n="SubCat_basics02_Header"></h3>
    </header>

    <main>
        <div class="subcategory-card" id="subcat_basics_02_01" data-audio-base-name="subcat_basics_02_01" style="background-color: #015554;">
            <img src="../../assets/images/icons/heart_inactive.png" class="favorite-icon" alt="Favorite">
            <div class="card-text">
                <span data-i18n="SubCat_Basics02_module1Title"><!-- Text aus Sprachdatei--></span>
            </div>
        </div>

        <div class="subcategory-card" id="subcat_basics_02_02" data-audio-base-name="subcat_basics_02_02" style="background-color: #03acaa;">
           <img src="../../assets/images/icons/heart_inactive.png" class="favorite-icon" alt="Favorite">
            <div class="card-text">
                <span data-i18n="SubCat_Basics02_module2Title"><!-- Text aus Sprachdatei--></span>
            </div>
        </div>

        <div id="course-timeline-container" style="display: none;">
            <!-- Timeline nodes will be generated by JS -->
        </div>
    </main>

   <script>
        fetch('/structure/footer.html')
            .then(response => response.text())
            .then(data => {
                document.body.insertAdjacentHTML('beforeend', data);
            });
    </script>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
    <script src="../../firebase-config.js"></script>
    <script src="../../main.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const isChallenge = urlParams.get('challenge') === 'true';

            if (isChallenge) {
                const timelineContainer = document.getElementById('course-timeline-container');
                
                // --- Generate and show timeline ---
                timelineContainer.innerHTML = ''; // Clear previous timeline
                let completedDays = 3; // Dummy data for demonstration

                // Only show completed days + the next one
                for (let i = 1; i <= completedDays + 1 && i <= 14; i++) {
                    const node = document.createElement('div');
                    node.classList.add('timeline-node');
                    if (i <= completedDays) {
                        node.classList.add('completed');
                    }

                    const circle = document.createElement('div');
                    circle.classList.add('node-circle');
                    circle.textContent = i;

                    const label = document.createElement('div');
                    label.classList.add('node-label');
                    label.textContent = `Tag ${i}`;
                    if (i > completedDays) {
                        label.textContent += ' (Nächste Übung)';
                    }

                    node.appendChild(circle);
                    node.appendChild(label);
                    timelineContainer.appendChild(node);
                }

                timelineContainer.style.display = 'block';
            }
        });
    </script>

</body>
</html>
