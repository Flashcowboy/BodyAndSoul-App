<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="pageTitleSubCategories">Grundübungen</title>
    <link rel="stylesheet" href="../../styles.css">
   <!-- <link rel="manifest" href="../manifest.json"> -->
    <style>
        body {
            display: flex;
            flex-direction: column;
            margin: 0;
            font-family: Arial, sans-serif;
            height: 100vh;
            background-color: #f4f4f9;
            background-image: url('../../assets/images/splash_screen_bg.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        header {
            text-align: center;
            padding: 5px 0;
        }

        main {
            /* The global rule already has overflow-y, but this page has specific padding */
            padding: 25px 10px;
        }

        .subcategory-card {
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.8);
            margin-bottom: 20px;
            overflow: hidden;
            position: relative;
            width: 100%;
            height: 150px;
        }


        .subcategory-card img:not(.favorite-icon) {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }
        
        .card-text {
            position: absolute;
            bottom: 0;
            left: 0;
            top: 60px; 
            width: 100%;
            padding: 15px;
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.3);
            color: rgb(242, 237, 237);
            font-size: 16px;
            font-weight: regular;
        }

        .favorite-icon {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 30px;
            height: 30px;
            cursor: pointer;
            z-index: 1;
        }
   
        
    </style>
</head>
<body>

    <header>
        <h3 data-i18n="SubCat_basics04_Header"></h3>
    </header>

    <main>
        <div class="subcategory-card" id="subcat_basics_04_01" data-audio-base-name="subcat_basics_04_01" style="background-color: #015554;">
            <img src="../../assets/images/icons/heart_inactive.png" class="favorite-icon" alt="Favorite">
            <div class="card-text">
                <span data-i18n="SubCat_Basics04_module1Title"><!-- Text aus Sprachdatei--></span>
            </div>
            
        </div>

        <div class="subcategory-card" id="subcat_basics_04_02" data-audio-base-name="subcat_basics_04_02" style="background-color: #03acaa;">
           <img src="../../assets/images/icons/heart_inactive.png" class="favorite-icon" alt="Favorite">
            <div class="card-text">
                <span data-i18n="SubCat_Basics04_module2Title"><!-- Text aus Sprachdatei--></span>
            </div>
            
        </div>
        

    </main>

   <script>
        fetch('/structure/footer.html')
            .then(response => response.text())
            .then(data => {
                document.body.insertAdjacentHTML('beforeend', data);
            });
    </script>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
    <script src="../../firebase-config.js"></script>
    <script src="../../main.js"></script>

</body>
</html>
