<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="BODY & SOUL">
    <title>Audio-Player</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
         body {
        
            background-color: #f2f4f7;
            /* Hintergrundbild direkt auf den Body anwenden */
            /* background-image: url('../assets/images/splash_screen_bg.png'); */
            /* background-image: url('../assets/images/backgrounds/lake_mountain.png'); */
            background-image: url('../assets/images/backgrounds/bg_trees.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
    }

    /* Prevent horizontal dragging causing lateral page shift */
    html, body { overscroll-behavior-x: none; touch-action: pan-y; }
    .progress-container { touch-action: none; }

        header {
            text-align: center;
            padding: 20px 0;
            background-color: rgba(81, 77, 52, 0.0);
        }

        header h1 {
            margin: 0;
            font-size: 24px;
            
        }

        .audioPlayerTitle{
            text-align: center;
            padding: 5px 0;
            background-color: #fff;
        }
        

        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .player-container {
            width: 90%;
            height: 550px;
            max-width: 500px;
            background-color: rgba(255, 255, 255, 0.0);
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.8);
            padding: 20px;
            display: flex;
            flex-direction: column;
            position: relative; /* favorite icon positioning */
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            overflow: hidden;
        }

        .progress-wrapper {
            width: 100%;
            margin: 0 auto;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 20px auto 0;
            width: 100%;
        }

        .controls img {
            width: 50px;
            height: 50px;
            cursor: pointer;
            transition: transform 0.2s ease-in-out;
        }

        .controls img:hover {
            transform: scale(1.1);
        }
        
        /* Neuer Stil für den Play-Button */
        #play-pause-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: rgba(117, 178, 238, 0);
            padding: 5px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
        }

        /* Fortschrittsbalken */
        .progress-container {
            width: 100%;
            height: 8px;
            background-color: #001405;
            border-radius: 4px;
            cursor: pointer;
        }
        .panel-text {
            text-align: justify;
            font-family: Arial, sans-serif;
            font-size: 12pt;
            color: rgb(0, 51, 82);
            margin-top: 6px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding-right: 4px; /* small gutter for scrollbar */
        }
        .track-title-block { width:100%; }
        .track-title-block #track-title { margin: 10px 0 0 0; text-align:center; }
        .scroll-area { flex:1 1 auto; width:100%; display:flex; flex-direction:column; min-height:0; }
        .scroll-area .panel-text-wrapper { flex:1 1 auto; min-height:0; display:flex; }
        .panel-text-wrapper .panel-text { flex:1 1 auto; min-height:0; }
        /* Constrain explanation area: reserve ~170px for playback group (progress + controls + spacing) */
        .panel-text { max-height: calc(100% - 20px); }
        @media (max-height: 640px){ .panel-text { max-height: calc(100% - 190px); } }
        .playback-group { margin-top:12px; width:100%; }
        .playback-group .progress-wrapper { margin-bottom:10px; }
        .playback-group .controls { margin-top:10px; }

        .progress-bar {
            height: 100%;
            background-color: rgb(243, 244, 246);
            width: 0%;
            border-radius: 4px;
            transition: width 0.1s linear; /* sanfter Übergang */
        }

        .time-display {
            width: 100%;
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 0.9em;
            color: rgb(15, 27, 59);
        }

        #track-title {
            text-align: center;
            font-family: Arial, sans-serif;
            color: rgb(15, 27, 59);
            margin-top: 15px;
            flex-grow: 1;
        }

        .app-logo {
            display: flex;
            justify-content: center;
            width: 100%;
            margin-top: 20px;
        }

        .app-logo img {
            max-width: 120px;
            height: auto;
        }
      
        
        .close-button {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close-button:hover,
        .close-button:focus {
            color: black;
        }

    /* Note: Background music UI removed (premixed-only). Keeping close-button for completion overlay. */

        .favorite-icon {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 30px;
            height: 30px;
            cursor: pointer;
            z-index: 1;
        }
    </style>
</head>
<body>

    <header>
        <h1 data-i18n="audioPlayerTitle"></h1><!-- Titel des Audio Players -->
    </header>

   <main>

        <div class="player-container">
            <div class="app-logo">
                <img src="../assets/images/logo_512.png" alt="Logo">
            </div>
            <audio id="audio-player" playsinline webkit-playsinline preload="auto"></audio>
            <div id="audio-loading-indicator" data-i18n="loadingAudio" style="display:none; text-align:center; font-size:0.85em; color:#0f1b3b; margin:6px 0 4px;">Lade...</div>
            <div class="scroll-area">
                <div class="track-title-block">
                    <p id="track-title"></p>
                </div>
                <div class="panel-text-wrapper">
                    <span class="panel-text" data-i18n="panelText"></span>
                </div>
            </div>
            <div class="playback-group">
                <div class="progress-wrapper">
                    <div class="progress-container" id="progress-container">
                        <div class="progress-bar" id="progress-bar"></div>
                    </div>
                    <div class="time-display">
                        <span id="current-time">0:00</span>
                        <span id="duration">0:00</span>
                    </div>
                </div>
                <div class="controls">
                    <img src="../assets/images/icons/rewind15_icon_black.png" alt="15 Sekunden zurückspulen" id="rewind-btn">
                    <img src="../assets/images/icons/play_icon_black.png" alt="Abspielen" id="play-pause-btn" class="play-pause-btn">
                    <img src="../assets/images/icons/forward15_icon_black.png" alt="15 Sekunden vorspulen" id="forward-btn">
                </div>
            </div>
            <div><img src="../assets/images/icons/heart_inactive.png" class="favorite-icon" alt="Favorite"></div>
        </div>



        <!-- Session Completion Screen (Initially Hidden) -->
        <div id="session-complete-screen" class="player-container" style="display: none; text-align: center; justify-content: center; position: relative;">
            <span id="completion-close-button" class="close-button" aria-label="Schließen" title="Schließen" style="position:absolute; right:10px; top:10px; color:#fff;">&times;</span>
            <h2 data-i18n="sessionCompleteTitle" style="color: white;">Gut gemacht!</h2>
            <p data-i18n="sessionCompleteMsg" style="color: white;">Dein Fortschritt wurde gespeichert.</p>
            <div id="completion-stats" style="color: white; margin: 20px 0;">
                <!-- Stats will be populated by JavaScript -->
            </div>
            <button id="back-to-overview-btn" class="lang-button">Zurück zur Übersicht</button>
        </div>
    </main>

    <!-- Background music selection modal removed (premixed-only). -->

 <script>
        fetch('/structure/footer.html')
            .then(response => response.text())
            .then(data => {
                document.body.insertAdjacentHTML('beforeend', data);
            });
    </script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
    <script src="../firebase-config.js"></script>
    <script src="../main.js"></script>

    <script>
    // Extra guard: prevent unintended horizontal page shift while interacting with player
    (function(){
        const root = document.scrollingElement || document.documentElement;
        let lastX = 0, active = false;
        window.addEventListener('touchstart', (e)=>{
            if(!e.touches || !e.touches.length) return;
            lastX = e.touches[0].clientX; active = true;
        }, {passive:true});
        window.addEventListener('touchmove', (e)=>{
            if(!active || !e.touches || !e.touches.length) return;
            const dx = Math.abs(e.touches[0].clientX - lastX);
            if (dx > 4) {
                // lock horizontal by resetting scrollLeft
                if (root.scrollLeft !== 0) root.scrollLeft = 0;
                // prevent browser from attempting horizontal pan
                if (e.cancelable) e.preventDefault();
            }
        }, {passive:false});
        window.addEventListener('touchend', ()=>{ active = false; }, {passive:true});
    })();
    </script>

    
    
</body>
</html>
