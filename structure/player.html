<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio-Player</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
         body {
        
            background-color: #f2f4f7;
            /* Hintergrundbild direkt auf den Body anwenden */
            background-image: url('../assets/images/backgrounds/bg_trees.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
            
        }

        header {
            text-align: center;
            padding: 20px 0;
            background-color: #fff;
        }

        .audioPlayerTitle{
            text-align: center;
            padding: 5px 0;
            background-color: #fff;
        }
        

        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .player-container {
            width: 90%;
            height: 300px;
            max-width: 500px;
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.7);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Hintergrundbild direkt auf den Body anwenden */
            background-image: url('../assets/images/backgrounds/bg_audioplayer_teal.png');
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }

        .controls img {
            width: 50px;
            height: 50px;
            cursor: pointer;
            transition: transform 0.2s ease-in-out;
        }

        .controls img:hover {
            transform: scale(1.1);
        }
        
        /* Neuer Stil für den Play-Button */
        #play-pause-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: rgb(0, 180, 193);
            padding: 5px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        /* Fortschrittsbalken */
        .progress-container {
            width: 100%;
            height: 8px;
            background-color: #001405;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 20px;
        }

        .progress-bar {
            height: 100%;
            background-color: rgb(0, 180, 193);
            width: 0%;
            border-radius: 4px;
            transition: width 0.1s linear; /* sanfter Übergang */
        }

        .time-display {
            width: 100%;
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 0.9em;
            color: rgb(0, 180, 193);
        }

        #track-title {
            text-align: center;
            font-family: Arial, sans-serif;
            color: rgb(0, 180, 193);
        }

        .app-logo {
            display: flex;
            justify-content: center;
        
            width: 100%;
        }

        .app-logo img {
            max-width: 220px;
            height: auto;
        }
      
        
    </style>
</head>
<body>

    <header>
        <h1 data-i18n="audioPlayerTitle"></h1><!-- Titel des Audio Players -->
    </header>
   <main>

        <div class="app-logo">
            <img src="../assets/images/logo_512.png" alt="Logo">
        </div>

        <div class="player-container">
            <h3 id="track-title"></h3> <!-- Tracktitel -->
            <audio id="audio-player"></audio>
            
            <div class="progress-container" id="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            
            <div class="time-display">
                <span id="current-time">0:00</span>
                <span id="duration">0:00</span>
            </div>

            <div class="controls">
                <img src="../assets/images/icons/rewind15_icon_white.png" alt="15 Sekunden zurückspulen" id="rewind-btn">
                <img src="../assets/images/icons/play_icon_black.png" alt="Abspielen" id="play-pause-btn" class="play-pause-btn">
                <img src="../assets/images/icons/forward15_icon_white.png" alt="15 Sekunden vorspulen" id="forward-btn">
            </div>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
    <script src="../firebase-config.js"></script>
    <script src="../main.js"></script>
    <footer>
        <div class="nav-item">
            <img src="../assets/images/icons/home.png" alt="Home" onclick="location.href='categories.html'">
        </div>
        <div class="nav-item">
            <img src="../assets/images/icons/yoga.png" alt="yoga pose style" onclick="location.href='profile.html'">
        </div>
        <div class="nav-item">
            <img src="../assets/images/icons/gear.png" alt="Settings" onclick="location.href='settings.html'">
        </div>
    </footer>
    
    
</body>
</html>
