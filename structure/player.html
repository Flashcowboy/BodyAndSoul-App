<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio-Player</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
         body {
        
            background-color: #f2f4f7;
            /* Hintergrundbild direkt auf den Body anwenden */
            background-image: url('../assets/images/splash_screen_bg.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        header {
            text-align: center;
            padding: 20px 0;
            background-color: rgba(81, 77, 52, 0.0);
        }

        header h1 {
            margin: 0;
            font-size: 24px;
            
        }

        .audioPlayerTitle{
            text-align: center;
            padding: 5px 0;
            background-color: #fff;
        }
        

        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .player-container {
            width: 90%;
            height: 300px;
            max-width: 500px;
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.8);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative; /* make favorite icon (absolute) relative to this container */
            /* Hintergrundbild direkt auf den Body anwenden */
            background-image: url('../assets/images/backgrounds/bg_audioplayer_blue02.png');
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }

        .controls img {
            width: 50px;
            height: 50px;
            cursor: pointer;
            transition: transform 0.2s ease-in-out;
        }

        .controls img:hover {
            transform: scale(1.1);
        }
        
        /* Neuer Stil für den Play-Button */
        #play-pause-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: rgb(189, 171, 130);
            padding: 5px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        /* Fortschrittsbalken */
        .progress-container {
            width: 100%;
            height: 8px;
            background-color: #001405;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 20px;
        }

        .progress-bar {
            height: 100%;
            background-color: rgb(162, 139, 73);
            width: 0%;
            border-radius: 4px;
            transition: width 0.1s linear; /* sanfter Übergang */
        }

        .time-display {
            width: 100%;
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 0.9em;
            color: rgb(239, 245, 246);
        }

        #track-title {
            text-align: center;
            font-family: Arial, sans-serif;
            color: rgb(236, 222, 186);
        }

        .app-logo {
            display: flex;
            justify-content: center;
        
            width: 100%;
        }

        .app-logo img {
            max-width: 220px;
            height: auto;
        }
      
        
    /* Styling for the volume slider */
        #bg-volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: rgb(162, 139, 73);
            outline: none;
            opacity: 0.8;
            -webkit-transition: opacity .2s;
            transition: opacity .2s;
        }

        #bg-volume-slider:hover {
            opacity: 1;
        }

        #bg-volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            box-shadow: 0 0 2px rgba(0,0,0,0.5);
        }

        #bg-volume-slider::-moz-range-thumb {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 2px rgba(0,0,0,0.5);
        }

        /* Modal for Background Music Selection */
        .modal {
            display: none; 
            position: fixed; 
            z-index: 1000; 
            left: 0;
            top: 0;
            width: 100%; 
            height: 100%; 
            overflow: auto; 
            background-color: rgba(0,0,0,0.6);
            -webkit-backdrop-filter: blur(5px);
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background-color: #fefefe;
            margin: 15% auto; 
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 400px;
            border-radius: 12px;
            text-align: center;
        }

        .close-button {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close-button:hover,
        .close-button:focus {
            color: black;
        }

        .music-tile-container {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }

        .music-tile {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            cursor: pointer;
            border: 3px solid transparent;
            transition: border-color 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            text-shadow: 1px 1px 2px black;
        }

        .music-tile.active {
            border-color: #a28b49;
        }

        .favorite-icon {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 15px;
            height: 15px;
            cursor: pointer;
            z-index: 1;
        }
    </style>
</head>
<body>

    <header>
        <h1 data-i18n="audioPlayerTitle"></h1><!-- Titel des Audio Players -->
    </header>

   <main>

        <div class="app-logo">
            <img src="../assets/images/logo_512.png" alt="Logo">
        </div>

        <div class="player-container">
            <p id="track-title"></p> <!-- Tracktitel -->
            <audio id="audio-player"></audio>
            <audio id="audio-player-bg"></audio>
            
            <div class="progress-container" id="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            
            <div class="time-display">
                <span id="current-time">0:00</span>
                <span id="duration">0:00</span>
            </div>

            <div class="controls">
                <img src="../assets/images/icons/rewind15_icon_white.png" alt="15 Sekunden zurückspulen" id="rewind-btn">
                <img src="../assets/images/icons/play_icon_black.png" alt="Abspielen" id="play-pause-btn" class="play-pause-btn">
                <img src="../assets/images/icons/forward15_icon_white.png" alt="15 Sekunden vorspulen" id="forward-btn">
            </div>

            <!-- Background music controls: icon opens modal, slider controls volume -->
            <div class="volume-container" id="bg-volume-container" style="width: 80%; margin-top: 15px; display: flex; align-items: center; gap: 10px;">
                <img src="../assets/images/icons/music.png" alt="Hintergrundmusik" id="open-music-modal" style="width: 25px; height: 25px; cursor: pointer;">
                <input type="range" id="bg-volume-slider" min="0" max="100" value="50" style="width: 100%;">
            </div>
            <!-- Displays the localized name of the currently selected background music -->
            <div id="bg-music-name" style="width: 80%; margin-top: 6px; font-size: 0.9em; color: white; text-align: left;"></div>

            <div><img src="../assets/images/icons/heart_inactive.png" class="favorite-icon" alt="Favorite"></div>

        </div>



        <!-- Session Completion Screen (Initially Hidden) -->
        <div id="session-complete-screen" class="player-container" style="display: none; text-align: center; justify-content: center;">
            <h2 data-i18n="sessionCompleteTitle" style="color: white;">Gut gemacht!</h2>
            <p data-i18n="sessionCompleteMsg" style="color: white;">Dein Fortschritt wurde gespeichert.</p>
            <div id="completion-stats" style="color: white; margin: 20px 0;">
                <!-- Stats will be populated by JavaScript -->
            </div>
            <button id="back-to-overview-btn" class="lang-button">Zurück zur Übersicht</button>
        </div>
    </main>

    <!-- Background Music Modal -->
    <!-- Modal: Choose background music by selecting one of the tiles -->
    <div id="music-modal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h3 data-i18n="bg_music_info_text">Wähle eine Hintergrundmusik</h3>
            <div id="bg-music-selection" class="music-tile-container">
                <!-- Music tiles will be inserted here -->
            </div>
        </div>
    </div>

 <script>
        fetch('/structure/footer.html')
            .then(response => response.text())
            .then(data => {
                document.body.insertAdjacentHTML('beforeend', data);
            });
    </script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
    <script src="../firebase-config.js"></script>
    <script src="../main.js"></script>

    
    
</body>
</html>
