<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="pageTitleSubCategories">Grundübungen</title>
    <link rel="stylesheet" href="../../styles.css">
   <!-- <link rel="manifest" href="../manifest.json"> -->
    <style>
        body {
            
            background-color: #f4f4f9;
            background-image: url('../../assets/images/splash_screen_bg.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        header {
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.8);
            margin: 0 auto 20px; /* center horizontally */
            overflow: hidden;
            position: relative;
            top: 10px;
            width: 95%;
            height: 150px;
            text-align: center;
            padding: 5px 0px;
        }

        main {
            /* The global rule already has overflow-y, but this page has specific padding */
            padding: 10px 30px;
        }

        .description-card {
            background-color: #fff;
            background-image: url('../../assets/images/backgrounds/bg_audioplayer_grey.png');
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.8);
            margin-bottom: 20px;
            overflow: hidden;
            position: relative;
            width: 100%;
            height: 200px;
        }

        .subcategory-card {
            background-color: #fff;
             background-image: url('../../../assets/images/backgrounds/bg_audioplayer_grey.png');
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
            overflow: hidden;
            position: relative;
            width: 100%;
            height: 100px;
        }

        /* Only target the background image inside the card, not nested icons */
        .subcategory-card > img {
            width: 100%;
            height: 70%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        .card-text {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 15px;
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.0);
            color: rgb(242, 237, 237);
            font-size: 18px;
            font-weight: regular;
        }

        .subcategory-headercard img:not(.favorite-icon) {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        .favorite-icon {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 30px;
            height: 30px;
            cursor: pointer;
            z-index: 1;
        }

   
        
    </style>
</head>
<body>

    <header>
        <div class="subcategory-headercard" id="Cat_card4Title">
            <img src="../../assets/images/categories/cat_11.png" alt="Angstbewältigung">
            <div class="card-text">
                <h2 data-i18n="card3Title">Angstbewältigung</h2>
            </div>
        </div>
    </header>

    <main>
            <span id="anxiety-text-content" data-i18n="Anxiety-Text" data-read-more data-max-chars="450"></span><br><br>
            
        <!-- <div class="subcategory-card" id="subcat03_01" onclick="window.location.href = 'exercises/subcat03_generalanxiety.html'" data-audio-base-name="subcat03_01" style="background-color: #a04902;"> -->
        <div class="subcategory-card" id="subcat03_01" onclick="window.location.href = '../anxiety/subcat_generalanxiety.html'" style="background-color:  #d96901;">
            <div class="card-text">
                <span data-i18n="GenAnxiety_cardTitle"></span>
            </div>
        </div>

        <div class="subcategory-card" id="subcat03_02" onclick="window.location.href = '../anxiety/subcat_socialanxiety.html'" style="background-color: #d92c01;">
            <div class="card-text">
                <span data-i18n="SocialAnxiety_cardTitle"></span>
            </div>

        </div>
        
    </main>

   <script>
        fetch('/structure/footer.html')
            .then(response => response.text())
            .then(data => {
                document.body.insertAdjacentHTML('beforeend', data);
            });
    </script>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
    <script src="../../firebase-config.js"></script>
    <script src="../../main.js"></script>
    <script>
        // Back button: avoid bouncing into player; fallback to categories overview
        (function(){
            const btn = document.getElementById('back-btn');
            if (!btn) return;
            btn.addEventListener('click', function(e){
                e.preventDefault();
                const ref = document.referrer || '';
                const isPlayer = /player\.html(\?|#|$)/.test(ref);
                if (!isPlayer && window.history && window.history.length > 1) {
                    window.history.back();
                } else {
                    window.location.href = '../categories.html';
                }
            });
        })();
    </script>
   
</body>
</html>
