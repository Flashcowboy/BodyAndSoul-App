    <link rel="stylesheet" href="../../styles.css">
   <!-- <link rel="manifest" href="../manifest.json"> -->
    <style>
        body {
            /* Hintergrundbild direkt auf den Body anwenden */
            background-image: url('../../assets/images/splash_screen_bg.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        header {
            text-align: center;
            padding: 5px 0;
        }

        .header-txt {
            text-align: justify;
            padding: 0 40px;
        }

        main {
            flex-grow: 1;
            overflow-y: auto;
            padding: 25px 10px;
        }

        .subcategory-card {
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.8);
            margin-bottom: 20px;
            overflow: hidden;
            position: relative;
            width: 100%;
            height: 150px;
        }


        .subcategory-card img:not(.favorite-icon) {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }
        
        .card-text {
            position: absolute;
            bottom: 0;
            left: 0;
            top: 60px; 
            width: 100%;
            padding: 15px;
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.3);
            color: rgb(242, 237, 237);
            font-size: 16px;
            font-weight: regular;
        }
        
        .favorite-icon {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 30px;
            height: 30px;
            cursor: pointer;
            z-index: 1;
        }
    </style>
</head>
