    <style>
     body {
            
            background-color: #f4f4f9;
            background-image: url('../../assets/images/splash_screen_bg.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        header {
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.8);
            margin: 0 auto 20px; /* center horizontally */
            overflow: hidden;
            position: relative;
            top: 10px;
            width: 95%;
            height: 150px;
            text-align: center;
            padding: 5px 0px;
        }

        main {
            /* The global rule already has overflow-y, but this page has specific padding */
            padding: 10px 30px;
        }

        .description-card {
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.8);
            margin-bottom: 20px;
            overflow: hidden;
            position: relative;
            width: 100%;
            height: 200px;
        }

        .subcategory-card {
            background-color: #fff;
            background-image: url('../../assets/images/backgrounds/bg_audioplayer_grey.png');
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.8);
            margin-bottom: 20px;
            overflow: hidden;
            position: relative;
            width: 100%;
            height: 100px;
        }

        /* Only target the background image inside the card, not nested icons */
        .subcategory-card > img {
            width: 100%;
            height: 70%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        .card-text {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 15px;
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.0);
            color: rgb(242, 237, 237);
            font-size: 18px;
            font-weight: regular;
        }

        .audiocard-text {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 15px;
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.0);
            color: rgb(242, 237, 237);
            font-size: 16px;
            font-weight: regular;
        }

        .headercard-text {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 5px;
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.6);
            color: rgb(242, 237, 237);
            font-size: 18px;
            font-weight: regular;
        }

        .subcategory-headercard img:not(.favorite-icon) {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        .subcategory-audiocard {
            background-color: #fff;
            background-image: url('../../assets/images/backgrounds/bg_audioplayer_grey.png');
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.8);
            margin-bottom: 20px;
            overflow: hidden;
            position: relative;
            width: 90%;
            height: 80px;
        }

        .playbtn {
            position: absolute;
            bottom: 10px;
            right: 10px;
        }
        .playbtn img {
            width: 24px;
            height: 24px;
        }

        .favorite-icon {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 15px;
            height: 15px;
            cursor: pointer;
            z-index: 1;
        }

        .challenge-button {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            z-index: 2;
        }

        .challenge-button .challenge-icon {
            height: 18px;
            width: 18px;
            object-fit: contain;
        }
        /* Back button next to description headline (push text below button) */
        .desc-header {
            position: relative;
            margin: 10px 0 10px;
            padding-top: 32px; /* make room for the back button (28px + small gap) */
        }
        .desc-header .back-btn {
            position: absolute;
            top: 0;
            right: 0;
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            line-height: 0;
        }
        .desc-header .back-btn img {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }

    <script>
        // Back button behavior: history back with fallback
        (function(){
            const btn = document.getElementById('back-btn');
            if (!btn) return;
            btn.addEventListener('click', function(e){
                e.preventDefault();
                if (window.history && window.history.length > 1) {
                    window.history.back();
                } else {
                    window.location.href = '../categories.html';
                }
            });
        })();
    </script>

    <script>//Akkordeon-Funktion für Audioplayer-Karten
            // Ensure accordion behavior is initialized after Tiles is available
            document.addEventListener('DOMContentLoaded', () => {
                const ensureTiles = () => {
                    if (window.Tiles && typeof window.Tiles.initSubcategoryAudioAccordion === 'function') {
                        window.Tiles.initSubcategoryAudioAccordion();
                    } else {
                        // If Tiles was not loaded via main.js, load it here
                        const s = document.createElement('script');
                        s.src = '../../tiles.js';
                        s.onload = () => window.Tiles && window.Tiles.initSubcategoryAudioAccordion();
                        document.head.appendChild(s);
                    }
                };
                ensureTiles();
            });
        </script>
