<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passwort zurücksetzen</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: Arial, sans-serif; color: #fff; }
        .splash-container { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; }
        .splashscreen-image { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url('assets/images/splash_screen.png'); background-size: cover; background-position: center; z-index: 1; }
        .content-container { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 20px; box-sizing: border-box; text-align: center; }
        .input-group { width: 100%; max-width: 300px; margin-bottom: 20px; border-radius: 20px; overflow: hidden; background-color: rgba(255, 255, 255, 0.2); }
        .input-group input { width: 100%; padding: 15px; border: none; background: transparent; color: white; font-size: 16px; outline: none; text-align: center; box-sizing: border-box; }
        .input-group input::placeholder { color: rgba(255, 255, 255, 0.7); }
        .action-button { width: 100%; max-width: 300px; padding: 15px; border: none; background-color: #5a7d9a; color: white; border-radius: 20px; font-size: 18px; cursor: pointer; transition: background-color 0.3s ease; margin-top: 10px; }
        .action-button:hover { background-color: #4a6a81; }
        .info-text { max-width: 300px; margin-bottom: 20px; font-size: 14px; line-height: 1.4; }
        .back-link { margin-top: 20px; font-size: 14px; } 
        .back-link a { color: white; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="splash-container">
        <div class="splashscreen-image"></div>
        <div class="content-container">
            <p class="info-text" data-i18n="passwordResetInfo">Geben Sie Ihre E-Mail-Adresse ein, um einen Link zum Zurücksetzen Ihres Passworts zu erhalten.</p>
            <div class="input-group">
                <input type="email" id="email-reset" data-i18n-placeholder="email_placeholder" placeholder="E-Mail" required>
            </div>
            <button id="reset-password-btn" class="action-button" data-i18n="passwordResetButton">Link anfordern</button>
            <div class="back-link" data-i18n="backToLoginLink">
                <a href="login.html">Zurück zum Login</a>
            </div>
        </div>
    </div>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
    <script src="firebase-config.js"></script>
    <script src="main.js"></script>
</body>
</html>
