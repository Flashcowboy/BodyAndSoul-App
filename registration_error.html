<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrierung fehlgeschlagen</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: Arial, sans-serif; color: #fff; }
        .splash-container { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; }
        .splashscreen-image { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url('assets/images/splash_screen.png'); background-size: cover; background-position: center; z-index: 1; }
        .content-container { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 20px; box-sizing: border-box; text-align: center; }
        .feedback-tile { background-color: rgba(0, 0, 0, 0.5); padding: 30px; border-radius: 20px; margin-bottom: 30px; max-width: 350px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .feedback-tile h2 { margin-top: 0; font-size: 24px; font-weight: bold; }
        .feedback-tile p { font-size: 16px; line-height: 1.5; }
        .action-button { width: 100%; max-width: 300px; padding: 15px; border: none; background-color: #5a7d9a; color: white; border-radius: 20px; font-size: 18px; cursor: pointer; transition: background-color 0.3s ease; margin-bottom: 15px; }
        .action-button:hover { background-color: #4a6a81; }
    </style>
</head>
<body>
    <div class="splash-container">
        <div class="splashscreen-image"></div>
        <div class="content-container">
            <div class="feedback-tile">
                <h2 data-i18n="regErrorTitle">Registrierung fehlgeschlagen</h2>
                <p data-i18n="regErrorText">Diese E-Mail-Adresse wird bereits verwendet oder das Passwort ist ungültig. Bitte versuchen Sie es erneut.</p>
            </div>
            <button class="action-button" onclick="window.location.href='register.html'" data-i18n="tryAgainButton">Erneut versuchen</button>
            <button class="action-button" onclick="window.location.href='login.html'" data-i18n="toLoginButton">Zum Login</button>
        </div>
    </div>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
    <script src="main.js"></script>
</body>
</html>
