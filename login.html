<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="loginTitle">Login</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            color: #fff;
        }

        .splash-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .login-container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .input-group {
            width: 100%;
            max-width: 300px;
            margin-bottom: 20px;
            border-radius: 20px;
            overflow: hidden;
            background-color: rgba(255, 255, 255, 0.2);
        }

        .input-group input {
            width: 100%;
            padding: 15px;
            border: none;
            background: transparent;
            color: white;
            font-size: 16px;
            outline: none;
            text-align: center;
            box-sizing: border-box;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .login-button {
            width: 100%;
            max-width: 300px;
            padding: 15px;
            border: none;
            background-color: #5a7d9a;
            color: white;
            border-radius: 20px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            margin-top: 10px;
        }

        .login-button:hover {
            background-color: #4a6a81;
        }

        .register-link {
            margin-top: 20px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
        }

        .register-link a {
            color: white;
            text-decoration: underline;
        }
        
        .reset_password_link a {
            color: white;
            text-decoration: underline;
        }
        
    </style>
</head>
<body>

    <div class="splash-container">
        <div class="splashscreen-image"></div>
        <div class="login-container">
            <div class="input-group">
                <input type="email" id="email" data-i18n-placeholder="email_placeholder" placeholder="E-Mail" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" data-i18n-placeholder="password_placeholder" placeholder="Passwort" required>
            </div>
            <button id="login-btn" class="login-button" data-i18n="loginButton">Login</button>
            <div class="register-link" data-i18n="no_account_register">
                Noch kein Konto? <a href="register.html">Hier registrieren.</a>
            </div>
            <div class="reset_password_link">
                <a href="#" id="forgot-password-link" data-i18n="login_forgotten_password">Passwort vergessen?</a>
            </div>
        
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
    <script src="main.js"></script>

</body>
</html>
